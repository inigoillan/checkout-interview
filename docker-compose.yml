name: checkout-interview

services:
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: checkout-interview-0001
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      bash -c "
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout.events.raw --partitions 3 --replication-factor 1;
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout.events.sanitised --partitions 3 --replication-factor 1;
      kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic checkout.counts --partitions 3 --replication-factor 1;
      kafka-topics.sh --bootstrap-server kafka:9092 --list;
      "
    restart: "no"

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: "0"
      DATA_DIR: /tmp/localstack/data
    volumes:
      - localstack-data:/tmp/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"available\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  checkout-ingestor:
    build:
      context: ./checkout-ingestor
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INPUT_TOPIC: checkout.events.raw
      OUTPUT_BUCKET: checkout-lake-raw

  checkout-quality-check:
    build:
      context: ./checkout-quality-check
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INPUT_TOPIC: checkout.events.raw
      OUTPUT_TOPIC: checkout.events.sanitised

  checkout-count:
    build:
      context: ./checkout-count
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      INPUT_TOPIC: checkout.events.sanitised
      OUTPUT_TOPIC: checkout.counts

volumes:
  localstack-data:
