kafka:
  bootstrap-servers: kafka:9092
  input-topic: checkout.events.raw
  group-id: checkout-ingestor

s3:
  region: eu-west-1
  endpoint: http://localstack:4566
  bucket: checkout-lake-raw
  landing-prefix: landing
  dlq-prefix: dlq
  access-key: test
  secret-key: test

checkpoints:
  location: s3://checkout-checkpoints/checkout-ingestor
  interval-seconds: 30

flink:
  sink-parallelism: 1
