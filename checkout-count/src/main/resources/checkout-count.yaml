kafka:
  bootstrap-servers: localhost:29092
  input-topic: checkout.events.sanitised
  start-offset: earliest

s3:
  region: eu-west-1
  endpoint:
  output:
    bucket: checkout-lake-raw
    prefix: counts
  dlq:
    bucket: checkout-lake-raw
    prefix: dlq
  checkpoints:
    location: s3://checkout-checkpoints/checkout-count

flink:
  parallelism:
    sink: 1
  watermark:
    bound: 30m
    idleness: 1m
  checkpointing:
    interval: 5m
    unaligned: true
